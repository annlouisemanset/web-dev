<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <div class="display" id="display">0</div>
        <div class="buttons">
            <button class="btn clear" data-action="clear">C</button>
            <button class="btn" data-action="sign">+/-</button>
            <button class="btn" data-action="percent">%</button>
            <button class="btn operator" data-value="/">÷</button>

            <button class="btn" data-value="7">7</button>
            <button class="btn" data-value="8">8</button>
            <button class="btn" data-value="9">9</button>
            <button class="btn operator" data-value="*">×</button>

            <button class="btn" data-value="4">4</button>
            <button class="btn" data-value="5">5</button>
            <button class="btn" data-value="6">6</button>
            <button class="btn operator" data-value="-">−</button>

            <button class="btn" data-value="1">1</button>
            <button class="btn" data-value="2">2</button>
            <button class="btn" data-value="3">3</button>
            <button class="btn operator" data-value="+">+</button>

            <button class="btn zero" data-value="0">0</button>
            <button class="btn" data-value=".">.</button>
            <button class="btn operator equals" data-action="equals">=</button>
        </div>
    </div>
    <!-- Paywall prank modal -->
    <div class="overlay" id="overlay">
        <div class="paywall">
            <div class="paywall-icon">🔒</div>
            <h2>Answer Locked</h2>
            <p>To view your result, please pay a small processing fee of</p>
            <div class="price">₱599.00</div>
            <p class="gcash-label">via GCash</p>

            <div id="paymentStep">
    <input type="tel" id="gcashNumber" placeholder="09XX XXX XXXX" maxlength="11">
    <button class="pay-btn" id="payBtn">Pay with GCash</button>
    <button class="cancel-btn" id="cancelBtn">Cancel</button>
</div>

            <div id="processingStep" class="hidden">
    <div class="spinner"></div>
    <p>Processing payment...</p>
</div>

<div id="receiptStep" class="hidden">
    <div class="receipt-check">✅</div>
    <h2>Payment Sent!</h2>
    <div class="receipt-box">
        <div class="receipt-row"><span>Amount</span><span>₱599.00</span></div>
        <div class="receipt-row"><span>To</span><span>Definitely Not A Scam Inc.</span></div>
        <div class="receipt-row"><span>Ref No.</span><span id="refNo"></span></div>
        <div class="receipt-row"><span>Status</span><span>Success 🎉</span></div>
    </div>
    <button class="pay-btn" id="closeReceiptBtn">Show me the answer!</button>
</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
